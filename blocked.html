<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blocked</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    main { width: 100%; max-width: 480px; text-align: center; }
    .badge {
      display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 600;
      letter-spacing: .06em; text-transform: uppercase; background: var(--blocked); color: #fff; margin-bottom: 16px;
    }
    .badge.lifted { background: var(--allowed); }
    h1 { font-size: 30px; word-break: break-word; }
    #reason { margin: 10px 0 0; }
    #lift { font-size: 20px; font-weight: 600; margin: 24px 0 4px; }
    #countdown { margin: 0 0 28px; }
    #note-form { text-align: left; margin: 0 0 20px; }
    #note-form label { display: block; font-weight: 600; margin-bottom: 6px; }
    #note-text { width: 100%; min-height: 72px; resize: vertical; }
    .note-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px; }
    #save-note { padding: 10px 20px; font-size: 15px; }
    #go { color: var(--muted); }
    #url { margin-top: 28px; word-break: break-all; }
    footer { margin-top: 24px; }
  </style>
</head>
<body>
  <main>
    <div class="badge" id="badge">Blocked</div>
    <h1 id="host">This site</h1>
    <p id="reason" class="muted"></p>
    <p id="lift"></p>
    <p id="countdown" class="muted"></p>
    <form id="note-form" hidden>
      <label for="note-text">Reason for visiting</label>
      <textarea id="note-text" maxlength="1000" placeholder="Why do you want to visit this site?"></textarea>
      <div class="note-actions">
        <span id="note-status" class="muted small" role="status"></span>
        <button type="submit" id="save-note" class="primary">Save note</button>
      </div>
    </form>
    <button id="go" hidden></button>
    <p id="url" class="muted small"></p>
    <footer>
      <button id="notes" class="link small">Notes</button>
      <button id="settings" class="link small">Settings</button>
    </footer>
  </main>
  <script type="module" src="blocked.js"></script>
</body>
</html>
