<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site Blocker Notes</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    .wrap { max-width: 860px; margin: 0 auto; padding: 28px 16px 64px; }
    header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    header h1 { font-size: 22px; }
    header p { margin: 4px 0 0; }

    .day { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 16px; }
    .day h2 { font-size: 14px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .day h2 .muted { font-weight: normal; }
    .day ul { list-style: none; margin: 0; padding: 0; }
    .note { display: grid; grid-template-columns: 48px minmax(0, 160px) minmax(0, 1fr) auto; gap: 12px; align-items: baseline; padding: 10px 16px; }
    .note + .note { border-top: 1px solid var(--border); }
    .note time { font-variant-numeric: tabular-nums; }
    .note .host { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .note .text { white-space: pre-wrap; overflow-wrap: anywhere; }
    .note button { align-self: center; }
    .tag {
      display: inline-block; margin-right: 8px; padding: 1px 8px; border-radius: 999px; vertical-align: 1px;
      font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap;
      background: var(--pass); color: #fff;
    }

    @media (max-width: 560px) {
      .note { grid-template-columns: 48px minmax(0, 1fr) auto; }
      .note .text { grid-column: 2 / 3; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Notes</h1>
        <p id="summary" class="muted"></p>
      </div>
      <button id="export">Export notes</button>
    </header>
    <div id="days"></div>
  </div>
  <script type="module" src="notes.js"></script>
</body>
</html>
