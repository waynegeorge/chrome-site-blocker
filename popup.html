<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>Site Blocker</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { width: 340px; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 15px; }
    .header-buttons { display: flex; gap: 6px; }
    ul { list-style: none; margin: 0; padding: 6px 0; max-height: 380px; overflow-y: auto; }
    li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 7px 14px; }
    li .domain { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    footer { padding: 10px 14px; border-top: 1px solid var(--border); }
    .empty { padding: 16px 14px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Site Blocker</h1>
      <div id="now" class="muted small"></div>
    </div>
    <div class="header-buttons">
      <button id="notes">Notes</button>
      <button id="settings">Settings</button>
    </div>
  </header>
  <ul id="sites"></ul>
  <footer id="attempts" class="muted small"></footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
